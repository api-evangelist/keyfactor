aid: keyfactor
name: Keyfactor
description: >-
  Keyfactor is a machine-identity and PKI (public key infrastructure) company
  that provides a control plane for digital trust — helping organizations
  discover, issue, automate, and govern cryptographic keys and certificates
  across enterprise, cloud, DevOps, and IoT environments. Its core products are
  Keyfactor Command (certificate lifecycle automation at scale), EJBCA
  Enterprise (modern, quantum-ready PKI and certificate authority), SignServer /
  Signum (code signing and verification), Cloud PKI-as-a-Service, and
  cryptographic discovery and inventory. Keyfactor Command and EJBCA expose REST
  APIs (self-hosted or cloud, per customer) with official Go, .NET, and CLI
  clients, and an experimental MCP server for agentic-AI integration. Keyfactor
  is trusted by roughly 40% of the Fortune 500 and is backed by Insight
  Partners.
